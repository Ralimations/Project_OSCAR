runtime:
  log_level: INFO
  dormant_fps: 15
  action_worker_poll_ms: 50
  gesture_cooldown_ms: 200
  memory_budget_gb: 10

hardware:
  cpu_threads: 4
  vision_thread_name: oscar-eyes
  wake_word_thread_name: oscar-ears
  pin_wake_word_low_usage: true
  prefer_openvino: true

screenpipe:
  enabled: true
  throttle_fps: 1
  video_archiving: false
  database_path: database/screenpipe.db

voice:
  piper_executable: piper
  model_path: models/piper/en_GB-alan-medium.onnx

models:
  llm_backend: openvino
  llm_variant: llama-3.2-1b
  llm_quantization: int4
  llm_model_path: models/llama
  vlm_variant: moondream2
  vlm_model_path: models/moondream2
  whisper_variant: tiny
  whisper_quantization: int8
  whisper_model_path: models/faster-whisper-tiny
  wake_word_model_path: models/openwakeword

gestures:
  pinch_threshold: 0.045
  scroll_deadzone: 0.03
  scroll_scale: 1200
  nod_threshold: 12
  shake_threshold: 18
