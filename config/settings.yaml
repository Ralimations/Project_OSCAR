{
  "runtime": {
    "log_level": "INFO",
    "dormant_fps": 15,
    "gesture_cooldown_ms": 200,
    "development_mode": false,
    "sandbox_actions_only": true,
    "require_calibration": true,
    "mirror_camera": true,
    "calibration_skip_steps": []
  },
  "hardware": {
    "cpu_threads": 4,
    "wake_word_thread_name": "oscar-wakeword",
    "gesture_thread_name": "oscar-gestures",
    "openvino_device": "AUTO"
  },
  "audio": {
    "enabled": true,
    "sample_rate": 16000,
    "chunk_ms": 80,
    "capture_seconds": 3.0,
    "wake_threshold": 0.5,
    "input_device": null
  },
  "screenpipe": {
    "enabled": true,
    "database_path": "database/screenpipe.db",
    "history_limit": 8
  },
  "models": {
    "active_profile": "aibox",
    "profiles": {
      "aibox": {
        "inference_backend": "ollama",
        "ollama_base_url": "http://127.0.0.1:11434",
        "ollama_model": "gemma4:e2b",
        "ollama_timeout_seconds": 120
      },
      "builtin": {
        "inference_backend": "ollama",
        "ollama_base_url": "http://127.0.0.1:11434",
        "ollama_model": "llama3.2:1b",
        "ollama_timeout_seconds": 120
      }
    },
    "hand_landmarker_task_path": "models/mediapipe/hand_landmarker.task",
    "face_landmarker_task_path": "models/mediapipe/face_landmarker.task",
    "wake_word_model_path": "models/openwakeword"
  },
  "gestures": {
    "pinch_threshold": 0.045,
    "scroll_deadzone": 0.03,
    "scroll_scale": 1200,
    "nod_threshold": 12,
    "shake_threshold": 18
  }
}
